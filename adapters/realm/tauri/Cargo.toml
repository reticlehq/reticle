[package]
name = "reticle-tauri"
version = "3.6.0"
edition = "2021"
description = "Reticle screenshots and headless mode for a Tauri app"
license = "MIT"
# crates.io shows these on the crate page; `repository` is also what links the published crate back
# to the source a reader can verify it against.
repository = "https://github.com/reticlehq/reticle"
homepage = "https://reticle.dev"
documentation = "https://docs.rs/reticle-tauri"
readme = "README.md"
keywords = ["tauri", "testing", "screenshot", "verification", "agent"]
categories = ["development-tools::testing", "gui"]
# Ship only what a consumer compiles. Excludes the local build output, which would otherwise be
# packed into the .crate and rejected for size.
exclude = ["target/", "Cargo.lock"]

[dependencies]
tauri = "2.12"

[target."cfg(target_os = \"macos\")".dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSBitmapImageRep", "NSGraphics"] }
objc2-foundation = { version = "0.3", features = [
  "NSError",
  "NSData",
  "NSDictionary",
  "NSString",
] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration"] }

[target."cfg(windows)".dependencies]
# Must be the versions tauri's own wry resolves: `with_webview` hands back ITS webview2 types, and a
# second copy of webview2-com/windows makes those types foreign to this crate (tauri 2.12 -> wry 0.57).
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }
# The version webkit2gtk itself resolves, so `snapshot` hands back the same `Surface` type.
cairo-rs = { version = "0.18", features = ["png"] }
