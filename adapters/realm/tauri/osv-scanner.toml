# Advisories in this crate's lockfile that cannot be cleared by a bump today, with why.
#
# All come from Tauri's Linux webview stack: tauri 2.x pins gtk-rs 0.18 (gtk, webkit2gtk, wry), and
# tauri-utils pins urlpattern 0.3. They clear when Tauri moves to gtk-rs 0.20+ / a newer urlpattern.
# None is reachable from Reticle's capture code, which never parses untrusted URL patterns or
# drives glib's variant iterator. Re-check on every Tauri minor.

[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
reason = "glib 0.18 VariantStrIter unsoundness; fixed in glib 0.20, which tauri 2.x does not accept yet. Not called by Reticle."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
reason = "proc-macro-error is unmaintained (not a vulnerability); a build-time macro dependency of glib-macros/gtk3-macros."

[[IgnoredVulns]]
id = "RUSTSEC-2025-0075"
reason = "unic-* crates unmaintained (not a vulnerability); pulled in by urlpattern 0.3 via tauri-utils."

