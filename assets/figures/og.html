<!doctype html><meta charset="utf-8">
<style>
  @import url('');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  body {

  h1 { font-size:82px; line-height:1.03; font-weight:700; letter-spacing:-2.6px; max-width:20ch; }
  h1 .dim { color:#9398a8; }
  .sub { margin-top:24px; font-size:29px; color:#aab0c2; line-height:1.42; max-width:34ch; font-weight:420; }
  .foot { display:flex; align-items:center; gap:14px; }
  .chip { font-size:20px; color:#c9cee0; border:1px solid rgba(255,255,255,.14);

          font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
