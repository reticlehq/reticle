version: 2
updates:
  # npm dependencies across the pnpm workspace. Grouped so a routine week is one PR, not twenty.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Non-breaking bumps land together; majors come as individual PRs so they're reviewed on purpose.
      minor-and-patch:
        update-types:
          - minor
          - patch
    # The published SDK carries zod as a real dependency; treat its majors as deliberate, reviewed changes.
    ignore:
      - dependency-name: zod
        update-types:
          - version-update:semver-major

  # Keep the GitHub Actions themselves current AND pinned — Dependabot updates the pinned SHAs for us.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types:
          - minor
          - patch
  # Rust. `reticle-tauri` is PUBLISHED to crates.io, so its dependency tree reaches users directly
  # and was the only shipped surface nothing watched: the npm ecosystem above cannot see a Cargo
  # manifest, and CodeQL does not scan Rust at all. Its Cargo.lock is committed, so Dependabot
  # resolves against the exact versions a consumer builds.
  - package-ecosystem: cargo
    directory: /packages/tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The Tauri smoke app. Not published, but it is compiled and RUN by the desktop battery, so a
  # vulnerable dependency here still executes on a runner. Its Cargo.lock is gitignored, so
  # Dependabot works from the manifest.
  - package-ecosystem: cargo
    directory: /apps/tauri-smoke/src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
