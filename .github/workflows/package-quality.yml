name: Package quality

# Gates the PUBLISHED artifacts on every PR so an exports/types/size regression can never ship:
#   publint  — package.json correctness (exports conditions, types-first ordering, files hygiene)
#   attw     — "are the types wrong": resolves the .d.ts in node10/node16(CJS+ESM)/bundler modes
#   size     — the embedded browser SDK's own packed dist stays under budget
# publint/attw already pass locally; this stops them from silently regressing.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: publint (every published package)
        run: |
          set -e
          for dir in packages/*/; do
            name=$(node -p "try{require('./$dir/package.json').private?'':require('./$dir/package.json').name}catch(e){''}")
            [ -z "$name" ] && continue
            echo "::group::publint $name"
            (cd "$dir" && npx --yes publint --strict)
            echo "::endgroup::"
          done

      - name: Are the types wrong (every published package)
        run: |
          set -e
          for dir in packages/*/; do
            name=$(node -p "try{require('./$dir/package.json').private?'':require('./$dir/package.json').name}catch(e){''}")
            [ -z "$name" ] && continue
            echo "::group::attw $name"
            # Two justified ignores: cjs-resolves-to-esm (packages are ESM-first, no CJS entry by design) and
            # no-resolution (the legacy node10 resolver doesn't read exports maps — modern packages skip it).
            (cd "$dir" && npx --yes @arethetypeswrong/cli --pack --ignore-rules cjs-resolves-to-esm no-resolution)
            echo "::endgroup::"
          done

      - name: Embedded SDK size budget
        run: |
          # The browser SDK is embedded in users' apps — guard its own dist from ballooning. This is the
          # package's shipped code (source maps included), NOT the bundled+deps figure; for that, add
          # size-limit later. Budget picked with headroom over the current ~0.6MB unpacked.
          bytes=$(cd packages/browser && npm pack --dry-run --json 2>/dev/null | node -e "process.stdin.resume();let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d)[0].unpackedSize))")
          echo "browser SDK unpacked: $bytes bytes"
          if [ "$bytes" -gt 900000 ]; then
            echo "::error::@reticlehq/browser unpacked size $bytes exceeds the 900KB budget"
            exit 1
          fi
