name: Package quality

# Gates the PUBLISHED artifacts on every PR so an exports/types/size regression can never ship:
#   publint  — package.json correctness (exports conditions, types-first ordering, files hygiene)
#   attw     — "are the types wrong": resolves the .d.ts in node10/node16(CJS+ESM)/bundler modes
#   size     — the embedded browser SDK's own packed dist stays under budget
# publint/attw already pass locally; this stops them from silently regressing.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: publint (every published package)
        run: |
          set -e
          # Every published package, found from the manifests. This was `for dir in packages/*/`
          # until 2026-09-12, and `packages/` was dissolved on 2026-09-10: the glob matched
          # nothing, bash passed the literal through, the require threw, `continue` fired, and the
          # step exited 0 having linted ZERO packages. A check that reads nothing reports exactly
          # like a check that passed. Driven off git now, so a rename cannot empty it again.
          dirs=$(git ls-files '*/package.json' | grep -v '^apps/' | xargs -n1 dirname)
          checked=0
          for dir in $dirs; do
            name=$(node -p "try{require('./$dir/package.json').private?'':require('./$dir/package.json').name}catch(e){''}")
            [ -z "$name" ] && continue
            checked=$((checked+1))
            echo "::group::publint $name"
            (cd "$dir" && npx --yes publint --strict)
            echo "::endgroup::"
          done
          echo "publint checked $checked package(s)"
          [ "$checked" -ge 10 ] || { echo "::error::publint checked $checked packages; expected at least 10"; exit 1; }

      - name: Are the types wrong (every published package)
        run: |
          set -e
          # Every published package, found from the manifests. This was `for dir in packages/*/`
          # until 2026-09-12, and `packages/` was dissolved on 2026-09-10: the glob matched
          # nothing, bash passed the literal through, the require threw, `continue` fired, and the
          # step exited 0 having linted ZERO packages. A check that reads nothing reports exactly
          # like a check that passed. Driven off git now, so a rename cannot empty it again.
          dirs=$(git ls-files '*/package.json' | grep -v '^apps/' | xargs -n1 dirname)
          checked=0
          for dir in $dirs; do
            name=$(node -p "try{require('./$dir/package.json').private?'':require('./$dir/package.json').name}catch(e){''}")
            [ -z "$name" ] && continue
            checked=$((checked+1))
            echo "::group::attw $name"
            # Two justified ignores: cjs-resolves-to-esm (packages are ESM-first, no CJS entry by design) and
            # no-resolution (the legacy node10 resolver doesn't read exports maps — modern packages skip it).
            (cd "$dir" && npx --yes @arethetypeswrong/cli --pack --ignore-rules cjs-resolves-to-esm no-resolution)
            echo "::endgroup::"
          done
          echo "attw checked $checked package(s)"
          [ "$checked" -ge 10 ] || { echo "::error::attw checked $checked packages; expected at least 10"; exit 1; }

      - name: Embedded SDK size budget
        run: |
          # The browser SDK is embedded in users' apps — guard its own dist from ballooning. This is the
          # package's shipped code (source maps included), NOT the bundled+deps figure; for that, add
          # size-limit later.
          #
          # 950KB was raised from 900KB in 2.9.0, and only AFTER taking the waste out rather than to
          # paper over it: the artwork, the icon set and the HUD's style strings were each being
          # copied a second time into the emitted .d.ts as literal types — 19.6KB of type information
          # no caller can use — and annotating them `: string` gave that back.
          #
          # 1000KB in 2.13.0, on the same terms. The waste came out first: MCP_DOCS_URL,
          # HUD_DRAG_IGNORE_SEL and HUD_LOG_WELL_CSS had reacquired exactly the defect above and were
          # annotated, which returned ~1.3KB. What remained is code somebody chose to ship, and the
          # release names it:
          #
          #   - registry/auto-testids.ts, new
          #   - registry/capabilities.ts, extended
          #   - the HUD's unreachable state — an instrumented page whose bridge never answered used to
          #     be indistinguishable from a page with no Reticle in it
          #   - desktop capture for the Electron and Tauri shells
          #
          # MEASURED 2026-09-11 (pre-ES2017): 660,466 bytes, and the ceiling was brought down to
          # 700,000 on that measurement — see git history for that reasoning.
          #
          # RAISED again here. The cause is in this diff: adapters/realm/browser and core now emit
          # ES2017 so webpack 4 (react-scripts 4) can parse them — issue #680 — and below ES2022 tsc
          # must downlevel class fields and private members from their native form into
          # WeakMap/assign helpers. That downlevel is real, measured growth on top of the
          # 660,466-byte baseline above, not a hypothetical one; nothing configurable avoids it
          # (ES2018 measures the same). MEASURED with this diff's actual ES2017 build: 736,229 bytes.
          # The ceiling is that measurement plus ~44KB, the same ~40-46KB shape of headroom this
          # comment has always used. The rule is unchanged: a raise to make a red check green is
          # what this comment exists to prevent, so if the reason is not in the diff, do not move
          # the number.
          bytes=$(cd adapters/realm/browser && npm pack --dry-run --json 2>/dev/null | node -e "process.stdin.resume();let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d)[0].unpackedSize))")
          echo "browser SDK unpacked: $bytes bytes"
          if [ "$bytes" -gt 780000 ]; then
            echo "::error::@reticlehq/browser unpacked size $bytes exceeds the 780KB budget"
            exit 1
          fi

          # The other package a size change is felt in, and it had no ceiling at all.
          #
          # Nobody installs @reticlehq/server as a dependency; an agent runs it with `npx`, which
          # downloads it before the first tool call of a fresh machine. That download is on the
          # path this project measures in minutes-to-first-verdict, so its size is a user-facing
          # number even though no package.json mentions it.
          #
          # MEASURED 2026-09-11: 4,845,142 bytes, most of it the docs that `pack-docs.mjs` stages
          # so the MCP surface can answer from them offline. Recorded at 5,200,000, which is
          # about 350KB of room. Same rule as the SDK above: if the reason is not in the diff,
          # do not move the number.
          #
          # RAISED to 5,400,000 on 2026-09-17, with the reason, on the first CI run that ever
          # measured this branch: 5,272,323 bytes, 72KB past the ceiling. The 350KB of room was
          # spent by v3.1.0 itself — recording, flows, hooks and the tour all land in `server/dist`.
          #
          # Two contributor docs came out of the tarball in the same change and are NOT what bought
          # the headroom: `telemetry-contract.md` and `telemetry-events.mdx` are about ADDING
          # telemetry to Reticle, so they should never have shipped to somebody who installed it.
          # That is 88KB and it only got the package back under the OLD number by 9KB, which is not
          # headroom, it is a coincidence waiting to fail on the next doc edit.
          #
          # So: 5,400,000, which is ~210KB of room over the measured 5,190,356. The docs are still
          # ~1MB of this package and are the first place to look when this is next hit.
          server_bytes=$(cd server && npm pack --dry-run --json 2>/dev/null | sed -n '/^\[/,$p' | node -e "process.stdin.resume();let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d)[0].unpackedSize))")
          echo "server unpacked: $server_bytes bytes"
          if [ "$server_bytes" -gt 5400000 ]; then
            echo "::error::@reticlehq/server unpacked size $server_bytes exceeds the 5400KB budget"
            exit 1
          fi
