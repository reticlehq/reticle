name: Package quality

# Gates the PUBLISHED artifacts on every PR so an exports/types/size regression can never ship:
#   publint  — package.json correctness (exports conditions, types-first ordering, files hygiene)
#   attw     — "are the types wrong": resolves the .d.ts in node10/node16(CJS+ESM)/bundler modes
#   size     — the browser SDK and server packages stay under budget (scripts/check-pack-size.mjs)
# Tool versions are explicit so a new upstream release cannot silently change the gate.
# Move these tools into the workspace lockfile when registry access is available;
# exact versions here still leave their transitive dependencies resolved at install time.

on:
  push:
    branches: [main]
  pull_request:

# A superseded pull-request run holds runners the next one needs; cancel it. Pushes to main and
# scheduled runs always finish, same rule as ci.yml.
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: publint (every published package)
        run: |
          set -e
          # Every published package, found from the manifests. This was `for dir in packages/*/`
          # until 2026-09-12, and `packages/` was dissolved on 2026-09-10: the glob matched
          # nothing, bash passed the literal through, the require threw, `continue` fired, and the
          # step exited 0 having linted ZERO packages. A check that reads nothing reports exactly
          # like a check that passed. Driven off git now, so a rename cannot empty it again.
          dirs=$(git ls-files '*/package.json' | grep -v '^apps/' | xargs -n1 dirname)
          checked=0
          for dir in $dirs; do
            name=$(node -p "try{require('./$dir/package.json').private?'':require('./$dir/package.json').name}catch(e){''}")
            [ -z "$name" ] && continue
            checked=$((checked+1))
            echo "::group::publint $name"
            (cd "$dir" && npx --yes publint@0.3.21 --strict)
            echo "::endgroup::"
          done
          echo "publint checked $checked package(s)"
          [ "$checked" -ge 10 ] || { echo "::error::publint checked $checked packages; expected at least 10"; exit 1; }

      - name: Are the types wrong (every published package)
        run: |
          set -e
          # Every published package, found from the manifests. This was `for dir in packages/*/`
          # until 2026-09-12, and `packages/` was dissolved on 2026-09-10: the glob matched
          # nothing, bash passed the literal through, the require threw, `continue` fired, and the
          # step exited 0 having linted ZERO packages. A check that reads nothing reports exactly
          # like a check that passed. Driven off git now, so a rename cannot empty it again.
          dirs=$(git ls-files '*/package.json' | grep -v '^apps/' | xargs -n1 dirname)
          checked=0
          for dir in $dirs; do
            name=$(node -p "try{require('./$dir/package.json').private?'':require('./$dir/package.json').name}catch(e){''}")
            [ -z "$name" ] && continue
            checked=$((checked+1))
            echo "::group::attw $name"
            # Two justified ignores: cjs-resolves-to-esm (packages are ESM-first, no CJS entry by design) and
            # no-resolution (the legacy node10 resolver doesn't read exports maps — modern packages skip it).
            (cd "$dir" && npx --yes @arethetypeswrong/cli@0.18.5 --pack --ignore-rules cjs-resolves-to-esm no-resolution)
            echo "::endgroup::"
          done
          echo "attw checked $checked package(s)"
          [ "$checked" -ge 10 ] || { echo "::error::attw checked $checked packages; expected at least 10"; exit 1; }

      - name: Published package size budgets
        run: |
          # The budgets, their history and the headroom convention live in the script, so a local
          # run and this one cannot disagree: `pnpm build && pnpm check:pack-size`.
          node scripts/check-pack-size.mjs
