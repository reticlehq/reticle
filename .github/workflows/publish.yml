name: Publish to npm

# Publishes the public @reticlehq/* packages (core, browser, react, server, vite-plugin, next,
# babel-plugin, test, eslint-plugin) when a GitHub Release is published, or on manual dispatch.
# `pnpm -r publish` walks the workspace in dependency order, skips `private` packages (the retired
# `@reticlehq/protocol` alias is marked private so it is never republished), and skips any version
# already on npm — so a partial/failed run is safe to re-trigger.
#
# NPM_TOKEN (an npm "Automation" token) lives in the "Production" GitHub Environment, so
# the job declares `environment: Production` below to bring that secret into scope.
#
# Provenance (the verified "published from GitHub Actions" badge) requires a PUBLIC repo +
# the id-token permission below. If the repo is still private, drop the NPM_CONFIG_PROVENANCE
# line (or make the repo public) or the publish will fail.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Production # NPM_TOKEN lives in this GitHub Environment
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Never publish from an arbitrary branch state on a manual dispatch — releases run against their
      # tag; a manual dispatch is only allowed from main. (A `release: published` event is already
      # tag-scoped by GitHub, so this only gates workflow_dispatch.)
      - name: Guard publish ref
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "refusing to publish from ${{ github.ref }} — dispatch only from main or publish via a Release"
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Gate the artifact: never publish code that fails the same checks CI enforces on every PR.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - name: Publish public packages
        run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
