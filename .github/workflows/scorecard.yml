name: OpenSSF Scorecard

# Runs the OpenSSF Scorecard supply-chain security analysis and publishes the results to the Security
# tab + the Scorecard badge, so the project's security posture is externally verifiable rather than
# asserted. Weekly + on push to main. Read the results at https://securityscorecards.dev.

on:
  branch_protection_rule:
  schedule:
    - cron: '18 5 * * 2' # Tuesdays
  push:
    branches: [main]

# Least privilege at the top; the job below adds only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to the Security tab
      id-token: write # publish results (OIDC) so the badge can read them
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true # feeds the badge + the public deps.dev entry
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
