name: CodeQL

# Static analysis (OpenSSF Scorecard SAST). Scans the TypeScript/JavaScript for injection, unsafe
# deserialization, path traversal, and the like — the same classes we hand-audit — on PRs, pushes to
# main, and a weekly schedule so a newly-published query catches an old pattern.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1' # Mondays, off the hour to avoid the load spike

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to the Security tab
    strategy:
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          # Broader query set than the default — worth it for a security-adjacent tool.
          queries: security-and-quality
          # Scan the code we SHIP. Test fixtures, benchmarks, and one-off scripts are not published;
          # their unused-var / quality notes are noise on the Security tab, not user-facing risk.
          config: |
            paths-ignore:
              - apps
              - bench
              - scripts
              - '**/*.test.ts'
              - '**/*.test.mjs'
      - name: Autobuild
        uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
