[package]
name = "tauri-smoke"
version = "0.0.0"
description = "Reticle Tauri smoke app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The desktop gate drives a RELEASE build of this fixture, so the crate is switched on there.
reticle-tauri = { path = "../../../adapters/realm/tauri", features = ["in-release"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
