[package]
name = "tauri-smoke"
version = "0.0.0"
description = "Reticle Tauri smoke app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reticle-tauri = { path = "../../../packages/tauri" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
