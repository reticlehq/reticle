packages:
  # The open specification. First, because everything else is an implementation of it.
  - 'openreality'
  # The rules that decide a verdict. Second, because it implements the specification and nothing else.
  - 'engine'
  - 'packages/*'
  # Adapters teach Reticle about one framework, build tool or kind of app. Same package rules as
  # anything in packages/, kept apart so somebody writing their own can see the shape at a glance.
  - 'adapters/*/*'
  - 'apps/*'
  - 'apps/examples/*'
