packages:
  # The open specification. First, because everything else is an implementation of it.
  - 'openreality'
  # The rules that decide a verdict. They implement the specification and nothing else.
  - 'engine'
  # The shared vocabulary: the names and shapes both ends of the connection agree on.
  - 'core'
  # The daemon, the agent's tool surface, and the `reticle` command.
  - 'server'
  # The scaffolder that wires Reticle into somebody's project.
  - 'init'
  # The spec runner and matchers a project uses in its own test suite.
  - 'spec-runner'
  # The suite that says whether an implementation of the specification behaves like one.
  - 'conformance'
  # Adapters teach Reticle about one framework, build tool, or kind of environment. Grouped by which
  # of those they are, so somebody writing their own can see the shape at a glance.
  - 'adapters/*/*'
  # Local fixtures and demos. Never published; deliberately allowed to depend on anything.
  - 'apps/*'
  - 'apps/examples/*'
